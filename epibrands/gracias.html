<style>
:root{
  --bg:#EDEDE8; --ink:#1A1A18; --ink-soft:#5C5C57; --ink-faint:#6A6A63;
  --line:rgba(26,26,24,0.14); --accent:#586552;
  --font:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  line-height:1.5; letter-spacing:-0.01em; min-height:100svh;
  display:flex; align-items:center; justify-content:center; padding:40px 24px;
}
.thanks{ width:min(100%,640px); text-align:center; }
.badge{
  display:inline-flex; align-items:center; gap:9px; margin-bottom:28px;
  padding:8px 16px; border:1px solid var(--line); border-radius:999px;
  font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent);
}
.badge::before{
  content:"✓"; width:20px; height:20px; border-radius:50%;
  background:var(--accent); color:var(--bg); display:inline-flex;
  align-items:center; justify-content:center; font-size:12px; font-weight:800;
}
.thanks h1{
  font-size:clamp(2rem,5.4vw,3.4rem); line-height:1.05; font-weight:600;
  letter-spacing:-0.04em; margin-bottom:20px;
}
.thanks h1 em{ font-style:normal; color:var(--ink-soft); }
.thanks p{ font-size:1.05rem; color:var(--ink-soft); max-width:46ch; margin:0 auto 36px; }
.actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.btn{
  display:inline-flex; align-items:center; gap:9px; font-size:14px; font-weight:500;
  padding:14px 26px; border-radius:999px; border:1px solid var(--ink); transition:all .35s var(--ease);
}
.btn-solid{ background:var(--ink); color:var(--bg); }
.btn-solid:hover{ background:transparent; color:var(--ink); }
.btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn-ghost:hover{ border-color:var(--ink); }
a.btn{ text-decoration:none; }
.micro{ font-size:13px; color:var(--ink-faint); margin-top:30px; }
.micro a{ color:var(--accent); }
</style>
</head>
<body>

       target="_blank" rel="noopener" class="btn btn-ghost">Consultar por WhatsApp</a>
  </div>
  <p class="micro">Para consultas urgentes: <a href="mailto:info@marianocalandra.com">info@marianocalandra.com</a>.</p>
</main>

<!-- Conversión del form EPIBRANDS Studio.
     studio.js deja la marca epi_lead_ok solo cuando Netlify confirma el
     envío; acá se consume una única vez. Así una recarga o una visita
     directa a esta página no cuentan como lead.
     - Meta: Lead (browser + CAPI, deduplicado por event_id).
     - dataLayer: generate_lead, sin datos personales. -->
<script>
document.addEventListener("DOMContentLoaded", function(){
  var origen = null;
  try {
    origen = sessionStorage.getItem("epi_lead_ok");
    if (origen !== null) sessionStorage.removeItem("epi_lead_ok");
  } catch (e) {
    // Sin sessionStorage: se cuenta solo si viene de la landing.
    if (/\/epibrands\/studio/.test(document.referrer)) origen = "sin-storage";
  }
  if (origen === null) return;
  if (window.mcTrack) window.mcTrack("Lead", { content_name: "EPIBRANDS Growth Partner", content_category: "form" });
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: "generate_lead", form_name: "epibrands-studio", lead_source: origen, page_path: location.pathname });
});
</script>
</body>
