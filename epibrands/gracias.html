<style>
:root{
  --bg:#EDEDE8; --ink:#1A1A18; --ink-soft:#5C5C57; --ink-faint:#6A6A63;
  --line:rgba(26,26,24,0.14); --accent:#586552;
  --font:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  line-height:1.5; letter-spacing:-0.01em; min-height:100svh;
  display:flex; align-items:center; justify-content:center; padding:40px 24px;
}
.thanks{ width:min(100%,640px); text-align:center; }
.badge{
  display:inline-flex; align-items:center; gap:9px; margin-bottom:28px;
  padding:8px 16px; border:1px solid var(--line); border-radius:999px;
  font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent);
}
/* Check animado (mismo efecto que el pago aprobado de Epicademy, sin
   confeti): el círculo entra con rebote y el tilde se dibuja. */
.check{ display:block; width:64px; height:64px; margin:0 auto 22px; }
.check circle{
  fill:var(--accent); transform-box:fill-box; transform-origin:center;
  animation:check-pop .55s cubic-bezier(.34,1.56,.64,1) .1s both;
}
.check path{
  fill:none; stroke:var(--bg); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:16; stroke-dashoffset:16;
  animation:check-draw .45s ease-out .55s forwards;
}
@keyframes check-pop{ from{ transform:scale(0); } to{ transform:scale(1); } }
@keyframes check-draw{ to{ stroke-dashoffset:0; } }
.thanks > *:not(.check){ animation:rise .6s var(--ease) both; }
.thanks > .badge{ animation-delay:.35s; }
.thanks > h1{ animation-delay:.45s; }
.thanks > p{ animation-delay:.55s; }
.thanks > .actions{ animation-delay:.65s; }
.thanks > .micro{ animation-delay:.75s; }
@keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }

/* Fundido al volver a la landing (las dos páginas lo declaran). */
@media (prefers-reduced-motion:no-preference){
  @view-transition{ navigation:auto; }
}
::view-transition-old(root), ::view-transition-new(root){ animation-duration:.32s; }

@media (prefers-reduced-motion:reduce){
  .check circle, .check path, .thanks > *{ animation:none; }
  .check path{ stroke-dashoffset:0; }
}
.thanks h1{
  font-size:clamp(2rem,5.4vw,3.4rem); line-height:1.05; font-weight:600;
  letter-spacing:-0.04em; margin-bottom:20px;
}
.thanks h1 em{ font-style:normal; color:var(--ink-soft); }
.thanks p{ font-size:1.05rem; color:var(--ink-soft); max-width:46ch; margin:0 auto 36px; }
.actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.btn{
  display:inline-flex; align-items:center; gap:9px; font-size:14px; font-weight:500;
  padding:14px 26px; border-radius:999px; border:1px solid var(--ink); transition:all .35s var(--ease);
}
.btn-solid{ background:var(--ink); color:var(--bg); }
.btn-solid:hover{ background:transparent; color:var(--ink); }
.btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn-ghost:hover{ border-color:var(--ink); }
a.btn{ text-decoration:none; }
.micro{ font-size:13px; color:var(--ink-faint); margin-top:30px; }
.micro a{ color:var(--accent); }
</style>
</head>
<body>

<!-- Google Tag Manager (noscript fallback) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WF2DG4B7"
height="0" width="0" class="gtm-noscript" style="display:none;visibility:hidden"></iframe></noscript>

<!-- Meta Pixel noscript (fallback sin JS) -->
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=1460516722431287&ev=PageView&noscript=1"/></noscript>

<main class="thanks">
  <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12"/><path d="M7 12.4l3.3 3.3L17 9"/></svg>

  <h1>Recibimos tu solicitud.</h1>
  <p>Mariano va a contactarte dentro de las 24 horas hábiles para coordinar los próximos pasos.</p>
  <div class="actions">
    <a href="/epibrands/studio" class="btn btn-solid">Volver a EPIBRANDS →</a>
    <a href="https://wa.me/5493416397137?text=Buenos%20d%C3%ADas.%20Acabo%20de%20enviar%20la%20solicitud%20desde%20la%20web%20de%20EPIBRANDS."
       target="_blank" rel="noopener" class="btn btn-ghost">Consultar por WhatsApp</a>
  </div>
  <p class="micro">Para consultas urgentes: <a href="mailto:info@marianocalandra.com">info@marianocalandra.com</a>.</p>
</main>

<!-- Conversión del form EPIBRANDS Studio.
     studio.js deja la marca epi_lead_ok solo cuando Netlify confirma el
     envío; acá se consume una única vez. Así una recarga o una visita
     directa a esta página no cuentan como lead.
     - Meta: Lead (browser + CAPI, deduplicado por event_id).
     - dataLayer: lead_captured (como el resto del sitio), sin datos personales.
       No usar generate_lead: el contenedor GTM-WF2DG4B7 lo convierte en un
       Lead de Meta y se contaría dos veces junto con el de meta-pixel.js. -->
<script>
document.addEventListener("DOMContentLoaded", function(){
  var origen = null;
  try {
    origen = sessionStorage.getItem("epi_lead_ok");
    if (origen !== null) sessionStorage.removeItem("epi_lead_ok");
  } catch (e) {
    // Sin sessionStorage: se cuenta solo si viene de la landing.
    if (/\/epibrands\/studio/.test(document.referrer)) origen = "sin-storage";
  }
  if (origen === null) return;
  if (window.mcTrack) window.mcTrack("Lead", { content_name: "EPIBRANDS Growth Partner", content_category: "form" });
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: "lead_captured", form_name: "epibrands-studio", lead_source: origen, page_path: location.pathname });
});
</script>
</body>
</html>
